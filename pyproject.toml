[project]
name = "reading-list"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lawrence John", email = "lawjoh30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.7",
    "pydantic>=2.14.3",
    "pymongo>=4.20.0",
]

[project.scripts]
reading-list = "reading_list:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
